<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Siege browser QA</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font: 13px monospace;
      }
      nav {
        display: flex;
        gap: 8px;
        padding: 8px;
        align-items: center;
      }
      button {
        padding: 8px;
        cursor: pointer;
      }
      iframe {
        border: 0;
        width: 100%;
        height: calc(100vh - 54px);
      }
      pre {
        white-space: pre-wrap;
        max-height: 200px;
        overflow: auto;
        margin: 0;
        padding: 10px;
      }
      #report:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <nav>
      <button id="memory">Building intelligence</button><button id="patrol">Patrol route</button><button id="technology">Technology choices</button><button id="directions">Infantry directions</button><button id="waypoints">Blocked waypoints</button><button id="population">Housing raid</button><button id="production">Production report</button><button id="stocks">Scouted stocks</button><button id="adaptive">Adaptive expansion</button><button id="subgroups">Selection subgroups</button><button id="commander">Defensive Commander ×20</button><button id="alerts">Attack reports</button><button id="mixed">Mixed Story ×20</button><button id="counters">Counter battle</button><button id="enemy-economy">Enemy economy</button><button id="economy">Economy opening</button><button id="siege">Siege battle</button><button id="expansion">Expansion checks</button><button id="suite">Run browser checks</button
      ><button id="victory">Story playthrough ×20</button
      ><button id="loss">Loss playthrough ×20</button
      ><button id="battle">Representative battle</button
      ><button id="performance">Measure 120 frames</button><button id="review">Battle review</button
      ><span id="status">Loading game</span>
    </nav>
    <pre id="report"></pre>
    <iframe id="play" src="../dist/index.html?v=0.23.1"></iframe>
    <script>
      const frame = document.getElementById('play');
      const sizes = new URLSearchParams(location.search);
      if (sizes.has('width')) { frame.style.width = sizes.get('width') + 'px'; frame.style.height = sizes.get('height') + 'px'; }
      document.querySelectorAll('nav button').forEach(b => b.disabled = true);
      frame.onload = async () => {
        for (const file of ['strategy.js', 'defense-strategy.js', 'alert-checks.js', 'selection-checks.js', 'resource-memory-checks.js', 'production-checks.js', 'population-checks.js', 'waypoint-checks.js', 'armor-checks.js', 'patrol-checks.js', 'intelligence-checks.js', 'book-checks.js', 'siege-checks.js', 'economy-checks.js', 'enemy-economy-checks.js', 'counter-checks.js', 'browser-driver.js']) {
          const s = frame.contentDocument.createElement('script');
          s.src = '../tests/' + file + '?v=0.23.1';
          s.async = false;
          await new Promise((resolve, reject) => { s.onload = resolve; s.onerror = reject; frame.contentDocument.body.append(s); });
        }
        document.getElementById('status').textContent = 'Ready';
        document.querySelectorAll('nav button').forEach(b => b.disabled = false);
      };
      for (const [id, fn] of [
        ['memory', 'browserIntelligence'],
        ['patrol', 'browserPatrol'],
        ['technology', 'browserTechnology'],
        ['directions', 'browserDirections'],
        ['waypoints', 'browserWaypoints'],
        ['population', 'browserPopulation'],
        ['production', 'browserProduction'],
        ['stocks', 'browserResourceMemory'],
        ['adaptive', 'browserAdaptiveExpansion'],
        ['subgroups', 'browserSubgroups'],
        ['commander', 'browserCommander'],
        ['alerts', 'browserAlerts'],
        ['mixed', 'browserMixedVictory'],
        ['counters', 'browserCounters'],
        ['enemy-economy', 'browserEnemyEconomy'],
        ['economy', 'browserEconomy'],
        ['siege', 'browserSiege'],
        ['suite', 'browserSuite'],
        ['expansion', 'browserExpansion'],
        ['victory', 'browserVictory'],
        ['loss', 'browserLoss'],
        ['battle', 'browserBattle'],
        ['performance', 'browserPerformance'],
        ['review', 'browserReview'],
      ])
        document.getElementById(id).onclick = () => frame.contentWindow[fn]();
    </script>
  </body>
</html>
