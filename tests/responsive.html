<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Siege responsive QA</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="phone" src="../dist/index.html"></iframe>
    <script>
      const p = new URLSearchParams(location.search),
        w = Number(p.get('width')) || 390,
        h = Number(p.get('height')) || 844;
      document.getElementById('phone').style.width = w + 'px';
      document.getElementById('phone').style.height = h + 'px';
      document.body.style.width = w + 'px';
      document.body.style.height = h + 'px';
    </script>
  </body>
</html>
